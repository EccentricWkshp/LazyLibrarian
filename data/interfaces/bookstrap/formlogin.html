<!DOCTYPE html>
<html lang="${ui_lang | h}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>${_('Login')} - LazyLibrarian</title>
  <style>
    :root {
      --page-bg: #202020;
      --panel-bg: #2a2a2a;
      --header-bg: #3a3f51;
      --text: #ccc;
      --muted: #909293;
      --input-bg: #333;
      --input-border: #4e4e4e;
      --accent: #5d9cec;
      --accent-hover: #4b8ad8;
      --error: #f05050;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--page-bg);
      color: var(--text);
      font-family: "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
    }
    .panel {
      width: 100%;
      max-width: 325px;
      border-radius: 4px;
      overflow: hidden;
      background: var(--panel-bg);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: var(--header-bg);
    }
    .panel-header img { height: 72px; }
    .panel-body { padding: 20px; }
    .sign-in { margin: 0 0 16px; text-align: center; font-size: 16px; }
    .message {
      margin: 0 0 16px;
      padding: 8px 12px;
      border-radius: 4px;
      background: rgba(240, 80, 80, 0.15);
      color: var(--error);
      text-align: center;
    }
    input[type=text], input[type=password] {
      display: block;
      width: 100%;
      height: 35px;
      margin-bottom: 12px;
      padding: 6px 16px;
      border: 1px solid var(--input-border);
      border-radius: 4px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 14px;
    }
    input[type=text]:focus, input[type=password]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 16px;
      color: var(--muted);
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover, button:focus { background: var(--accent-hover); }
  </style>
</head>
<body>
  <main class="panel">
    <div class="panel-header">
      <img src="${img | h}" alt="LazyLibrarian">
    </div>
    <div class="panel-body">
      <form action="login" method="post">
        <p class="sign-in">${_('Sign in to continue')}</p>
        %if msg:
          <p class="message" role="alert">${msg | h}</p>
        %endif
        <input type="hidden" name="from_page" value="${from_page | h}">
        <input type="text" name="current_username" id="current_username" value="${username}"
               placeholder="${_('Username') | h}" aria-label="${_('Username') | h}" autocomplete="username" required autofocus>
        <input type="password" name="current_password" id="current_password"
               placeholder="${_('Password') | h}" aria-label="${_('Password') | h}" autocomplete="current-password" required>
        <label class="remember">
          <input type="checkbox" name="remember_me" value="1"> ${_('Remember me')}
        </label>
        <button type="submit" id="login">${_('Login')}</button>
      </form>
    </div>
  </main>
</body>
</html>
