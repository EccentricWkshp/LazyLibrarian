# Lint and test every push to master and every pull request, then build the Docker image.
# Pushes to master publish eccentricwkshp/lazylibrarian:latest on Docker Hub and the same on
# ghcr.io, version tags publish that version, pull requests only check that the image builds.
# Docker Hub needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets, without them only
# ghcr.io is published.
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that's still going.
# Each job has a time limit, so a hang fails in minutes rather than GitHub's 6 hours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # the same ruff version as requirements-dev.txt, without installing everything else
      - run: pip install "$(grep '^ruff==' requirements-dev.txt)"
      - run: ruff check --output-format=github LazyLibrarian.py lazylibrarian unittests

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # python-magic needs libmagic. Windows has none, and LazyLibrarian works without it.
      # The runner has Git's msys libmagic on the PATH, which lazylibrarian/filemagic.py skips
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libmagic1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest unittests -q

  docker:
    name: Docker image
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      DOCKERHUB_REPO: eccentricwkshp/lazylibrarian
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUBLISH == 'true' && env.DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # latest from master, 2026.10.25 and 2026.10 from a v2026.10.25 tag, sha-1234567 always
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB == 'true' && format('docker.io/{0}', env.DOCKERHUB_REPO) || '' }}
            ghcr.io/${{ github.repository_owner }}/lazylibrarian
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: LL_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The Docker Hub page shows docker/README.md, kept up to date from master
      - if: env.PUBLISH == 'true' && env.DOCKERHUB == 'true' && github.ref == 'refs/heads/master'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          short-description: Ebook, audiobook, magazine and comic manager, in the style of Sonarr and Radarr
          readme-filepath: docker/README.md
          enable-url-completion: true
